# AKS. Azure Database, workload identity, Key Vault through external-secrets.
config:
  initialAdminEmails: admin@example.com
  intelligence:
    apiUrl: https://api.intelligence.copilotkit.ai
    gatewayWsUrl: wss://realtime.intelligence.copilotkit.ai
  auth:
    google:
      clientId: example.apps.googleusercontent.com
  publicUrl: https://ccpbot.example.com
postgresql:
  enabled: false
database:
  existingSecret: ccpbot-database
serviceAccount:
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
server:
  podLabels:
    azure.workload.identity/use: "true"
externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-key-vault
  data:
    - secretKey: key-encryption-key
      remoteRef:
        key: ccpbot-key-encryption-key
    # Sessions are signed with this. The server refuses to start when sign-in is configured and it
    # is missing, so every provider store has to carry it.
    - secretKey: better-auth-secret
      remoteRef:
        key: ccpbot-better-auth-secret
    - secretKey: intelligence-api-key
      remoteRef:
        key: ccpbot-intelligence-api-key
    - secretKey: google-client-secret
      remoteRef:
        key: ccpbot/google-client-secret
    - secretKey: computer-token
      remoteRef:
        key: ccpbot/computer-token
    - secretKey: license-token
      remoteRef:
        key: ccpbot-license-token
ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  hosts:
    - host: ccpbot.example.com
      paths:
        - path: /
          pathType: Prefix

computers:
  mode: shared
