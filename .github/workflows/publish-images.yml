name: publish-images

# Builds the five images the stack runs and publishes them to GitHub Container Registry.
#
# Registration happens here rather than on a workstation because the credentials differ: a release
# needs `packages: write` on the repository itself, which `GITHUB_TOKEN` has and a developer's
# personal token usually does not. Tagging the repository is the whole trigger — the tag the cluster
# pins is the tag that was built from that commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under, for a re-run (defaults to the pushed tag)"
        required: false

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ccpbot
            dockerfile: server/Dockerfile
          - name: ccpbot-agent-computer
            dockerfile: agent-computer/Dockerfile
          - name: ccpbot-supervisor
            dockerfile: supervisor/Dockerfile
          - name: ccpbot-agent-bot
            dockerfile: agent-bot/Dockerfile
          - name: ccpbot-agent-langgraph
            dockerfile: agent-langgraph/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Container registry paths are lowercase only, and an account name is not: `ghcr.io/DamonZS/x`
      # is rejected by buildx with "repository name must be lowercase" before any layer is built.
      - name: Resolve the registry namespace
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # A digest, not a tag, is what the deployment pins: a tag can be moved after the version that
      # was tested, and the release manifest is the record of what was tested.
      - name: Record the digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -n --arg reference "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}@${DIGEST}" \
                --arg name "$NAME" \
                --arg version "$TAG" \
                '{version: $version, images: {($name): {reference: $reference}}}' \
            > "manifest-${NAME}.json"
          cat "manifest-${NAME}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.name }}
          path: manifest-${{ matrix.name }}.json
          if-no-files-found: error

  release:
    name: release manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
          path: manifests

      # `container-images.json` is the contract the desktop installer reads: one digest per
      # published name. Composing it from the five job artifacts keeps it a single source of truth
      # even though the images are built independently.
      - name: Compose container-images.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -s --arg version "$TAG" \
            '{version: $version, images: (map(.images) | add)}' \
            manifests/manifest-*.json > container-images.json
          jq . container-images.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" container-images.json --clobber
          else
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" container-images.json \
              --title "CCP-Bot $TAG" --notes-file notes.md
          fi