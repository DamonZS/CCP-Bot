name: publish-images

# Builds every image the stack runs and publishes them to GitHub Container Registry.
#
# The list is NOT repeated here: it is `.github/published-images.json`, the same file the desktop
# harness test reads and the same file the release's `container-images.json` keys on. Three places
# have to agree about image names — the build matrix, the manifest every deployment pins, and the
# harnesses a Bot can be registered against — and the way they stop agreeing is that one of them
# carries a copy. So the workflow reads the list and derives the registry path from the name:
# `ccpbot` is published as-is (the all-in-one image the Kubernetes chart serves every role from),
# everything else is prefixed, so `server` becomes `ccpbot-server`.
#
# Registration happens here rather than on a workstation because the credentials differ: a release
# needs `packages: write` on the repository itself, which `GITHUB_TOKEN` has and a developer's
# personal token usually does not. Tagging the repository is the whole trigger — the tag the cluster
# pins is the tag that was built from that commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under, for a re-run (defaults to the pushed tag)"
        required: false

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # `_about` is documentation for a human reading the file; it is not an image. Every other key
      # is the published name, and its value is the Dockerfile that builds it.
      - name: Build the matrix from published-images.json
        id: matrix
        run: |
          matrix=$(jq -c '
            to_entries
            | map(select(.key | startswith("_") | not))
            | map({
                name: .key,
                image: (if .key == "ccpbot" then "ccpbot" else "ccpbot-\(.key)" end),
                dockerfile: .value
              })
          ' .github/published-images.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.[] | "\(.name) <- \(.dockerfile)"'

      # A Dockerfile on disk that nothing publishes is a component nobody can deploy, and a listed
      # image with no Dockerfile fails the build an hour into the release instead of here.
      - name: Every listed Dockerfile exists, and every Dockerfile is listed
        run: |
          jq -r 'to_entries | map(select(.key | startswith("_") | not)) | .[] | .value' \
            .github/published-images.json | while read -r file; do
              test -f "$file" || { echo "published-images.json names ${file}, which is not in the tree"; exit 1; }
            done
          git ls-files '*Dockerfile' | grep -v '/tests/fixtures/' | while read -r file; do
              jq -e --arg f "$file" \
                '[to_entries[] | select(.key | startswith("_") | not) | .value] | index($f)' \
                .github/published-images.json > /dev/null \
                || { echo "${file} builds an image nothing publishes"; exit 1; }
            done

  publish:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Container registry paths are lowercase only, and an account name is not: `ghcr.io/DamonZS/x`
      # is rejected by buildx with "repository name must be lowercase" before any layer is built.
      - name: Resolve the registry namespace
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # A digest, not a tag, is what the deployment pins: a tag can be moved after the version that
      # was tested, and the release manifest is the record of what was tested.
      - name: Record the digest
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -n --arg reference "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}@${DIGEST}" \
                --arg name "$NAME" \
                --arg version "$TAG" \
                '{version: $version, images: {($name): {reference: $reference}}}' \
            > "manifest-${NAME}.json"
          cat "manifest-${NAME}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.name }}
          path: manifest-${{ matrix.name }}.json
          if-no-files-found: error

  release:
    name: release manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
          path: manifests

      # `container-images.json` is the contract the desktop installer reads: one digest per
      # published name. Composing it from the job artifacts keeps it a single source of truth even
      # though the images are built independently.
      - name: Compose container-images.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -s --arg version "$TAG" \
            '{version: $version, images: (map(.images) | add)}' \
            manifests/manifest-*.json > container-images.json
          jq . container-images.json

      # A manifest that is missing one name is worse than no manifest: `pin()` in deployment.rs
      # refuses the partial set, but only after somebody has downloaded a deployment, so it is
      # cheaper to fail here where the reason is one line of output.
      - name: Check every image the release names is in the manifest
        run: |
          jq -r 'to_entries | map(select(.key | startswith("_") | not)) | .[].key' \
            .github/published-images.json | while read -r name; do
              jq -e --arg n "$name" '.images | has($n)' container-images.json > /dev/null \
                || { echo "container-images.json has no entry for ${name}"; exit 1; }
            done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" container-images.json --clobber
          else
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" container-images.json \
              --title "CCP-Bot $TAG" --notes-file notes.md
          fi
          # Re-pushing a tag leaves GitHub holding the old release as a draft, which downloads 404
          # for everyone without a token. Publishing explicitly makes the end state the same whether
          # this ran against a fresh release or an existing one.
          gh release edit "$TAG" --draft=false