name: build-pgvector

# The extension macOS local mode cannot run without, built where it has to be built.
#
# `server/drizzle/0000_schema.sql` opens with `CREATE EXTENSION IF NOT EXISTS vector`, so a
# PostgreSQL without pgvector stops at the first migration and takes the whole stack down with it
# (`Could not open extension control file … vector.control`). Windows uses a community Windows zip
# and pins its hash; macOS has no such zip, and pgvector publishes no binaries at all, so this
# workflow makes one.
#
# ITS OWN WORKFLOW, ON PURPOSE. The installers are what somebody downloads to use this product, and
# a compile that only macOS needs must not be able to fail the release that carries them. This one
# attaches a single file next to them and nothing else depends on it having run.
#
# The extension is compatible within a major version — what it links is the server's own symbols —
# so it is compiled against PostgreSQL 17, which is the version the portable database unpacks
# (17.6). It is built on an Apple-silicon runner because the archive it goes into is the arm64
# download, and the architecture is asserted rather than assumed.
#
# Tagged rather than versioned with the app: the download URL a pinned hash points at has to keep
# naming the same bytes after the app has moved on, so this builds once under a tag of its own
# (`pgvector-0.8.6`) and whoever wires up macOS local mode pins that URL and the hash printed here.
on:
  push:
    tags: ["pgvector-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the archive to, e.g. pgvector-0.8.6"
        required: true

concurrency:
  group: build-pgvector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extension:
    name: pgvector-macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the extension
        shell: bash
        run: |
          brew install postgresql@17
          curl -sSL -o pgvector.tar.gz \
            https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.6.tar.gz
          # The source is pinned by hash: pgvector publishes no release assets, so a tag is the only
          # thing that names this source, and a tag can be moved.
          echo "10bf9938906e5d643bbc4a7eea104b6f57ba4898e5b76b20e60484ea1d5a7f8f  pgvector.tar.gz" \
            | shasum -a 256 -c -
          tar xzf pgvector.tar.gz
          cd pgvector-0.8.6
          # The floor matters more than the architecture. Left alone, clang stamps this with the
          # SDK on the runner — macOS 26 today — and dyld then refuses to load it on an older Mac:
          # `minos` is a promise that the binary needs an OS at least that new. The person's machine
          # is not the runner, so the floor is set to 13.0 Ventura and checked in the log below.
          export MACOSX_DEPLOYMENT_TARGET=13.0
          make PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          mkdir -p ../out
          cp vector.dylib vector.control ../out/
          # `DATA_built`: the install script is generated by the build, not checked in.
          cp sql/vector--0.8.6.sql ../out/
          ls -l ../out

      - name: Assert the extension is arm64
        shell: bash
        run: |
          archs="$(lipo -archs out/vector.dylib)"
          echo "archs: $archs"
          case "$archs" in
            *arm64*) ;;
            *) echo "expected an arm64 extension, got: $archs"; exit 1 ;;
          esac
          # What it links decides whether the portable PostgreSQL can load it: an extension that
          # needed a library only this runner has would fail at `CREATE EXTENSION` on somebody's Mac,
          # where the only libraries are the ones the portable database unpacks beside it.
          otool -L out/vector.dylib
          # What it links decides whether the portable PostgreSQL can load it: an extension that
          # needed a library only this runner has would fail at `CREATE EXTENSION` on somebody's Mac,
          # where the only libraries are the ones the portable database unpacks beside it. The code
          # signature entitlement that lets it load an unsigned `vector.dylib` beside it is a
          # property of that PostgreSQL, not of this file, so nothing here has to be signed.
          otool -l out/vector.dylib | grep -A4 LC_BUILD_VERSION | head -12
          floor="$(otool -l out/vector.dylib | awk '/LC_BUILD_VERSION/{seen=1} seen && /minos/{print $2; exit}')"
          echo "minos: $floor"
          case "$floor" in
            1[0-3].*) ;;
            *) echo "the extension was built for macOS $floor, which an older Mac will refuse to load"; exit 1 ;;
          esac

      - name: Pack the three files a CREATE EXTENSION needs
        shell: bash
        run: |
          cd out
          # Uncompressed, deliberately: the app unpacks this itself, and an inner archive would mean
          # a second format to read on macOS for a payload of a few hundred kilobytes.
          zip -q pgvector-macos-arm64.zip vector.dylib vector.control vector--0.8.6.sql
          ls -l pgvector-macos-arm64.zip
          # The number to pin in the download table. Printed, not remembered.
          shasum -a 256 pgvector-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pgvector-macos-arm64
          path: out/pgvector-macos-arm64.zip
          if-no-files-found: error

  attach:
    name: attach the archive
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: pgvector-macos-arm64
          path: extension

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ls -l extension
          # Another workflow may be creating the same release in the same minute; a create that
          # loses that race is not a failure here, because the upload below is the point.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "CCP-Bot $TAG" --notes "CCP-Bot $TAG" \
            || true
          gh release upload "$TAG" extension/pgvector-macos-arm64.zip --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,assets \
            | jq -r '.assets[] | "\(.name)\t\(.size)"'