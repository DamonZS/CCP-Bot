name: local-mode-macos

# Proves that a Mac can run CCP-Bot the way Windows does: every part as an ordinary process, no
# container engine, no administrator, no virtual machine.
#
# WHY THIS IS NOT PART OF `build-installers`. The local route downloads a portable PostgreSQL
# (~390 MB on macOS), unpacks it, runs `initdb`, and starts real processes. That is the only place
# the macOS half of this can be proven — this machine (the developer's) is Windows, and a claim
# about `darwin` compiled from here is an inference, not evidence. Keeping it in its own workflow
# means a macOS-only failure cannot stop the installers from being built and attached, which is the
# same reason `build-pgvector.yml` is separate.
#
# BY HAND, ON PURPOSE, FOR NOW. macOS runner minutes are the most expensive ones this repository
# spends, and a run costs a download of the database plus a few minutes of real processes. Run it
# when the local route changes; once it has proven itself, adding `push: tags: ["v*"]` here is the
# way to make a release wait for it.
on:
  workflow_dispatch:

concurrency:
  group: local-mode-macos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: the local route, on a Mac
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable

      # The first start builds the interface when `app/dist` is missing, and it starts the server
      # from `server/`, which resolves its workspace links out of the root install. So the root
      # install is what these tests need — not desktop's own, which is only for the bundler.
      - name: Install the workspace dependencies
        run: bun install --frozen-lockfile

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # The decisive one goes first, so a Mac that cannot run the stack fails in the first few
      # minutes instead of after every other live test has spent its download. This is also the
      # step that would catch a `#[cfg(unix)]` compile error — the one thing a Windows machine
      # cannot check, because it never compiles those branches.
      #
      # An exit code is not enough evidence here: a filter that matched nothing, or a test that
      # was renamed, would also look like a pass. The log is checked for the two lines the stack
      # prints when it is up — the server answering, and the Bot's own process answering.
      - name: Prove this Mac runs the stack
        shell: bash
        run: |
          log=local-mode-live.log
          cargo test -p ccpbot-desktop --manifest-path desktop/src-tauri/Cargo.toml \
            --lib -- local::tests::live_start_serves_the_interface_on_this_machine \
            --include-ignored --nocapture -- --test-threads=1 2>&1 | tee "$log"
          grep -F '[ready] CCP-Bot is running on this computer (/health 200).' "$log" \
            || { echo "the local stack never reached ready on this Mac"; tail -40 "$log"; exit 1; }
          grep -F '[bot] The built-in Bot is answering (/health 200).' "$log" \
            || { echo "the built-in Bot never answered on this Mac"; tail -40 "$log"; exit 1; }

      # Each test is named, one per invocation, and every invocation is asserted to have run exactly one
      # test. A filter matching nothing exits 0 — measured on this job: a `--lib` invocation given the
      # name of a test that lives in the binary reported `0 passed; 723 filtered out` and the step went
      # green, which is what a real gap in coverage looks like when nobody counts. Two of the three are
      # in `main.rs` (the ownership records a start writes and a quit cleans up), one is in the library.
      #
      # Not `local::tests::live_` with `--skip`: measured on this job's first run, three `--skip` flags
      # were echoed and every one of them was ignored, so the test that cannot pass here ran anyway and
      # the job went red for a reason that is not this Mac. One name per invocation also makes "one test
      # at a time" structural rather than a flag — each of these starts a real database and four
      # processes, and letting them race for ports and the same checkout root turns a real failure into
      # a flaky one. `--include-ignored` is the point of the job: every `live_` test is ignored by
      # default precisely because it does this.
      #
      # Left out on purpose: `live_a_fresh_folder_installs_the_bots_own_dependencies`, which prepares a
      # checkout from the *published* release and then starts it with this tree's route, so it can only
      # pass when the published sources agree with it. They do not today: 0.3.2's server still refuses to
      # start without a CopilotKit connection, while this tree's route stopped inventing one (0.4.0). Put
      # it back once `latest` resolves to a 0.4.0-or-later release. The macOS half of what it proves —
      # unpacking the portable database, installing the Bot's own dependencies, `[schema]` — is already
      # in the decisive step above, whose log shows them on a checkout that started empty.
      - name: Run the rest of the local-mode live tests
        run: |
          set -euo pipefail
          run_one() {
            local target="$1" name="$2" log="live-$2.log"
            echo "===== $name ($target) ====="
            cargo test -p ccpbot-desktop --manifest-path desktop/src-tauri/Cargo.toml \
              "$target" -- "$name" --include-ignored --nocapture 2>&1 | tee "$log"
            if ! grep -q 'test result: ok. 1 passed' "$log"; then
              echo "::error::$name did not run, or did not pass"
              exit 1
            fi
          }
          run_one --lib "local::tests::live_an_empty_folder_is_filled_from_the_release"
          run_one --bin ccpbot-desktop "tests::live_a_run_on_this_computer_records_what_it_owns"
          run_one --bin ccpbot-desktop "tests::live_quitting_stops_the_stack_this_computer_started"

      # A failing test says which part did not answer and nothing about why: the reason is in the
      # process's own log, which lives on the runner that is about to be deleted. Learned the hard
      # way — the first run that got past the compile error failed at the computer and left no
      # trace of it, so the whole run had to be repeated just to read one file. `always()` because
      # the interesting case is exactly the one where a step above already failed.
      - name: Keep the local logs when something did not come up
        if: always()
        shell: bash
        run: |
          for log in logs/local-computer.log logs/local-server.log logs/local-bot.log \
            logs/local-postgres.log; do
            echo "===== $log ====="
            if [ -f "$log" ]; then tail -200 "$log"; else echo "(not written)"; fi
          done

          # What the database said it was compiled for is not what it ran as: EDB configures once
          # and lipos two slices, so both slices print the same build string. Whether this runner
          # and the payload are really arm64 is a separate fact, and the claim "this works on Apple
          # silicon" depends on it — so it is read off the artifacts instead.
          echo "===== the machine this ran on ====="
          uname -m
          sw_vers 2>/dev/null || true
          echo "===== the database payload this run unpacked ====="
          if [ -f postgres/pgsql/bin/postgres ]; then
            lipo -archs postgres/pgsql/bin/postgres
            file postgres/pgsql/bin/postgres
          else
            echo "(the portable database was not unpacked in this run)"
          fi
          if [ -f postgres/pgsql/lib/postgresql/vector.dylib ]; then
            lipo -archs postgres/pgsql/lib/postgresql/vector.dylib
          else
            echo "(no vector library where the mac tree expects it)"
          fi